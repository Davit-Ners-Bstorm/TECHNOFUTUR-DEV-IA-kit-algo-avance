[project]
name = "algo-avance"
version = "0.1.0"
description = "Développeur IA 2026 — Algorithmes avancés : exercices et labs"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "hypothesis",
    "pytest-timeout",
    "duckdb>=2.0.0",
    "numpy>=2.5.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["j1", "j2", "j3", "j4", "j5"]
addopts = "--import-mode=importlib -q"
markers = ["perf: test de performance (budget de temps)"]
